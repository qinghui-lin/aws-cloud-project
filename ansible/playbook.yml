---
- name: Configuration et durcissement du serveur AWS
  hosts: webservers
  become: true

  tasks:
    - name: Mise à jour du cache apt et installation de Docker + UFW
      ansible.builtin.apt:
        name:
          - docker.io
          - ufw
        state: present
        update_cache: true

    - name: Démarrer et activer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Configuration du pare-feu UFW (SSH et HTTP uniquement)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"

    - name: Activer UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Copier les fichiers de l'application sur le serveur
      ansible.builtin.copy:
        src: ../app/
        dest: /opt/webapp/
        mode: "0644"
        directory_mode: "0700"

    - name: Construire l'image Docker sur le serveur
      ansible.builtin.command: docker build -t pfe-webapp:latest /opt/webapp/
      changed_when: true

    - name: Lancer le conteneur web
      ansible.builtin.command: docker run -d --name webapp --restart always -p 80:8080 pfe-webapp:latest
      changed_when: true
