name: ansible-lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.11.0
        with:
          working_directory: "ansible"