name: DevSecOps IaC & Container Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  terraform-security-check:
    name: Terraform Validate & Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format & Validate
        working-directory: ./terraform
        run: |
          terraform fmt -check -recursive || true
          terraform init -backend=false
          terraform validate

      - name: Run Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  config-and-script-scan:
    name: Ansible Lint, Trivy Scan & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ansible Collections
        run: ansible-galaxy collection install community.general

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@v26
        with:
          working_directory: ansible
          args: "playbook.yml"
        continue-on-error: true

      - name: Run Trivy Config Scan (Dockerfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'app/'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run ShellCheck on Bash Scripts
        run: shellcheck deploy.sh